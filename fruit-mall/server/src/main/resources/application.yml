# 公共配置：所有环境共用；数据库与 Redis 连接信息在 application-local.yml 中
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fruit-mall-server
  profiles:
    active: local
  servlet:
    multipart:
      # 图片上传大小限制
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    # 时区固定东八区；Java 8 时间类型的具体格式见 JacksonConfig
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  mvc:
    # 关闭默认的静态资源兜底，未匹配的请求交给全局异常处理统一返回 404
    problemdetails:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fruitmall.**.domain
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除字段：业务代码不写 deleted = 0，由 @TableLogic 接管
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false

springdoc:
  api-docs:
    path: /v3/api-docs

fruit-mall:
  jwt:
    # 令牌有效期（分钟），密钥在 application-local.yml 中配置，不入仓库
    expire-minutes: 120
  auth:
    # 免登录接口白名单，逗号分隔；后续商品浏览、推荐等公开接口在此追加
    exclude-paths: >-
      /api/auth/admin/login,
      /api/auth/member/login,
      /api/auth/member/register,
      /api/shop/category/**,
      /api/shop/product/**,
      /api/shop/behavior/report,
      /api/shop/review/spu/**,
      /api/files/**
  file:
    # 图片上传目录与访问前缀
    upload-dir: ./upload
    access-prefix: /api/files
  order:
    # 待支付订单的支付时限（分钟）与超时关单扫描间隔（毫秒）
    expire-minutes: 30
    timeout-scan-interval: 60000
    timeout-scan-initial-delay: 30000

logging:
  level:
    root: info
    com.fruitmall: info
