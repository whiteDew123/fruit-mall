# 公共配置：所有环境共用；数据库与 Redis 连接信息在 application-local.yml 中
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fruit-mall-server
  profiles:
    active: local
  servlet:
    multipart:
      # 图片上传大小限制
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    # 时区固定东八区；Java 8 时间类型的具体格式见 JacksonConfig
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  mvc:
    # 关闭默认的静态资源兜底，未匹配的请求交给全局异常处理统一返回 404
    problemdetails:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fruitmall.**.domain
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除字段：业务代码不写 deleted = 0，由 @TableLogic 接管
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false

springdoc:
  api-docs:
    path: /v3/api-docs

fruit-mall:
  jwt:
    # 令牌有效期（分钟），密钥在 application-local.yml 中配置，不入仓库
    expire-minutes: 120
  auth:
    # 完全跳过鉴权的路径：连令牌都不解析，UserContext 一定为空
    exclude-paths: >-
      /api/auth/admin/login,
      /api/auth/member/login,
      /api/auth/member/register,
      /api/files/**
    # 可选登录路径：公开可访问，但带令牌时会识别用户身份。
    # 首页推荐需要它做个性化，行为埋点需要它记录会员归属，
    # 这类接口不能放进上面的白名单，否则 UserContext 永远为空。
    optional-paths: >-
      /api/shop/category/**,
      /api/shop/product/**,
      /api/shop/recommend/**,
      /api/shop/review/spu/**,
      /api/shop/behavior/report
  file:
    # 图片上传目录与访问前缀
    upload-dir: ./upload
    access-prefix: /api/files
  order:
    # 待支付订单的支付时限（分钟）与超时关单扫描间隔（毫秒）
    expire-minutes: 30
    timeout-scan-interval: 60000
    timeout-scan-initial-delay: 30000
  recommend:
    # 权重方案版本号会写入推荐留痕，便于对比不同权重方案的效果
    version: v2026-10-08
    # 行为时间衰减半衰期（天）与画像回溯窗口（天）
    half-life-days: 14
    behavior-window-days: 30
    # 热度统计窗口（天）与召回候选上限
    hot-days: 7
    recall-limit: 100
    # 多因素权重：内容偏好、时令、热度、价格、品质
    weights:
      CONTENT: 0.35
      SEASON: 0.20
      HOT: 0.20
      PRICE: 0.15
      QUALITY: 0.10

logging:
  level:
    root: info
    com.fruitmall: info
